# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set API_TOKEN=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không khai báo startCommand: Railway chạy startCommand KHÔNG qua shell, nên
# cú pháp ${PORT:-8000} sẽ tới thẳng uvicorn dưới dạng chuỗi literal và chết
# ngay ("not a valid integer"). Để trống thì Railway dùng CMD của Dockerfile,
# vốn đã bọc trong `sh -c` nên biến môi trường được expand đúng.
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
